name: XiaoYuWorkspace
options:
  bundleIdPrefix: com.xiaoyu
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    VALID_ARCHS: arm64
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_CFBundleDisplayName: 小鱼工作台
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    CODE_SIGN_ENTITLEMENTS: XiaoYuWorkspace/App/XiaoYuWorkspace.entitlements
    ENABLE_HARDENED_RUNTIME: YES
targets:
  XiaoYuWorkspace:
    type: application
    platform: macOS
    sources:
      - path: XiaoYuWorkspace
        excludes:
          - App/XiaoYuWorkspace.entitlements
          - App/Info.plist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: XiaoYuWorkspace/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyu.workspace.native27
        PRODUCT_NAME: 小鱼工作台
        PRODUCT_MODULE_NAME: XiaoYuWorkspace
        SWIFT_STRICT_CONCURRENCY: complete
  XiaoYuWorkspaceTests:
    type: bundle.unit-test
    platform: macOS
    sources: [XiaoYuWorkspaceTests]
    dependencies:
      - target: XiaoYuWorkspace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyu.workspace.native27.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/小鱼工作台.app/Contents/MacOS/小鱼工作台"
        BUNDLE_LOADER: "$(TEST_HOST)"
  XiaoYuWorkspaceUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [XiaoYuWorkspaceUITests]
    dependencies:
      - target: XiaoYuWorkspace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyu.workspace.native27.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ""
schemes:
  XiaoYuWorkspace:
    build:
      targets:
        XiaoYuWorkspace: all
        XiaoYuWorkspaceTests: [test]
    test:
      targets:
        - XiaoYuWorkspaceTests
